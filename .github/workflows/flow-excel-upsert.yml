name: Flow Excel Upsert Checks

on:
  push:
    branches:
      - feature/flow-excel-upsert
  pull_request:
    paths:
      - 'apps/web/src/core/builders/FlowBuilder/**'
      - 'apps/web/test/flowExcelUploader.test.ts'
      - 'apps/server/src/flow-engine/FlowEngineCore.ts'
      - 'apps/server/src/system-support/metadata-loader-routes.ts'
      - 'package.json'
      - '.github/workflows/flow-excel-upsert.yml'

permissions:
  contents: read

jobs:
  flow-excel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Flow Excel and metadata regression tests
        run: npm run test:metadata
      - name: Web TypeScript and production build
        run: npm run build --workspace apps/web
      - name: Server TypeScript and build
        run: npm run build --workspace apps/server
