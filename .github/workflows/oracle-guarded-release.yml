name: Oracle guarded production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "verify only (no changes), or deploy (back up SQL and release backend)"
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy
      confirmation:
        description: "For deploy only, type deploy"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/oracle-guarded-release.yml"
      - "scripts/oracle-guarded-deploy.sh"

permissions:
  contents: read

concurrency:
  group: oracle-production-release
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate deployment script
        run: bash -n scripts/oracle-guarded-deploy.sh

  release-on-oracle:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    environment: oracle-production
    timeout-minutes: 45
    steps:
      - name: Validate dispatch
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$GITHUB_REF" = "refs/heads/main"
          if [[ "$OPERATION" == "deploy" ]]; then test "$CONFIRMATION" = "deploy"; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify or deploy with automatic service rollback
        env:
          DEPLOY_APPROVED: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: bash scripts/oracle-guarded-deploy.sh "$OPERATION"
