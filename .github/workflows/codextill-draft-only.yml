name: Apply CODEXTILL Desktop metadata draft (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codextill-draft-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-production-release-main
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    environment: oracle-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build existing PageRuntime and CODEXTILL layout only
        run: |
          set -euo pipefail
          npm ci
          npm run build:system --workspace apps/server
          bash -n scripts/oracle/apply-codextill-draft-only.sh
      - name: Apply and independently verify CODEXTILL Desktop draft
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          sudo -n true
          sudo -n env GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash scripts/oracle/apply-codextill-draft-only.sh "$GITHUB_WORKSPACE"
