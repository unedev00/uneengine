name: Repair CODEXTILL free-canvas geometry (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codextill-draft-only.yml'
      - 'scripts/oracle/apply-codextill-draft-only.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-production-codextill-metadata-only
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    environment: oracle-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build existing PageRuntime and CODEXTILL layout only
        run: |
          set -euo pipefail
          npm ci
          npm run build:system --workspace apps/server
          bash -n scripts/oracle/apply-codextill-draft-only.sh
          node apps/server/scripts/fix-codextill-free-canvas.mjs --preflight
      - name: Fix and independently verify CODEXTILL free-canvas positions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          sudo -n true
          curl -fsS --max-time 10 https://api.unesolutions.co.uk/api/health | grep -q '"status":"ok"'
          sudo -n env GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash scripts/oracle/apply-codextill-draft-only.sh "$GITHUB_WORKSPACE"
