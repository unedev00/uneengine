name: Bind CODEXTILL tabs/cart and product card click (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codextill-data-bindings.yml'
      - 'scripts/codextill/bind-tab-and-cart.mjs'
      - 'scripts/codextill/bind-product-card-click.mjs'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/codextill-data-bindings.yml'
      - 'scripts/codextill/bind-tab-and-cart.mjs'
      - 'scripts/codextill/bind-product-card-click.mjs'
permissions:
  contents: read
concurrency:
  group: oracle-production-codextill-metadata-only
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate CODEXTILL category and cart binding contract
        run: |
          set -euo pipefail
          npm ci
          npm run build:system --workspace apps/server
          node scripts/codextill/bind-tab-and-cart.mjs --preflight
          node scripts/codextill/bind-product-card-click.mjs --preflight
  apply:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    environment: oracle-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build existing PageRuntime and CODEXTILL layout only
        run: |
          set -euo pipefail
          npm ci
          npm run build:system --workspace apps/server
          bash -n scripts/oracle/apply-codextill-draft-only.sh
          node scripts/codextill/bind-tab-and-cart.mjs --preflight
          node scripts/codextill/bind-product-card-click.mjs --preflight
      - name: Save and verify CODEXTILL category and CartLine bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          sudo -n true
          curl -fsS --max-time 10 https://api.unesolutions.co.uk/api/health | grep -q '"status":"ok"'
          sudo -n env GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -c '
            set -Eeuo pipefail
            test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
            test -r /etc/metadrive/production.env
            set -a
            source /etc/metadrive/production.env
            set +a
            test -n "${DATABASE_URL:-}"
            cd "$GITHUB_WORKSPACE"
            node scripts/codextill/bind-tab-and-cart.mjs
            node scripts/codextill/bind-product-card-click.mjs
          '
