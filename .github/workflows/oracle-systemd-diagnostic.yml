name: Oracle systemd control-plane diagnosis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-systemd-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    timeout-minutes: 5
    steps:
      - name: Inspect systemd control-plane state (read only)
        shell: bash
        run: |
          set -uo pipefail
          test "${GITHUB_REPOSITORY}" = "unedev00/uneengine" || exit 1
          test "$(uname -m)" = "aarch64" || exit 1
          echo "== systemd manager health =="
          timeout 6 systemctl show -p Version,SystemState,Reloading --no-pager 2>&1 || true
          echo "== manager pid and wait state =="
          ps -p 1 -o pid,ppid,stat,wchan:35,etime,comm || true
          cat /proc/1/wchan 2>/dev/null || true
          echo "== system bus and blocked processes =="
          ps -eo pid,ppid,stat,wchan:32,etime,comm | grep -E '(^ *PID|systemd|dbus|systemctl|polkit|journald|nginx|node)' | head -n 70 || true
          echo "== D-Bus socket and manager unit =="
          timeout 5 systemctl is-active dbus.service 2>&1 || true
          timeout 5 systemctl list-jobs --no-pager 2>&1 | head -n 35 || true
          echo "== recent PID 1 journal =="
          timeout 8 journalctl -b _PID=1 -n 35 --no-pager -o short-iso 2>&1 || true
          echo "== filesystem resources =="
          df -h / /run || true
          free -m || true
          echo "Diagnostic complete; no changes made."
      - name: Diagnose public frontend routing (read only)
        shell: bash
        run: |
          set -uo pipefail
          echo "== frontend release pointer =="
          readlink -f /var/www/metadrive-frontend/current || true
          echo "== current release manifest on disk =="
          head -c 350 /var/www/metadrive-frontend/current/frontend-release.json 2>/dev/null || true
          echo
          echo "== routed release manifest via HTTP localhost =="
          curl --noproxy '*' -fsS --max-time 10 -H 'Host: unesolutions.co.uk' http://127.0.0.1/frontend-release.json | head -c 350 || true
          echo
          echo "== routed release manifest via local HTTPS =="
          curl --noproxy '*' -fsS --max-time 10 --resolve unesolutions.co.uk:443:127.0.0.1 https://unesolutions.co.uk/frontend-release.json | head -c 350 || true
          echo
          echo "== routed release manifest via public HTTPS =="
          curl -fsS --max-time 10 -H 'Cache-Control: no-cache' https://unesolutions.co.uk/frontend-release.json | head -c 350 || true
          echo
          echo "== active frontend vhosts =="
          ls -l /etc/nginx/sites-enabled/ 2>/dev/null | head -n 28 || true
          echo "== loaded Nginx listen/server/root/route directives =="
          sudo -n nginx -T 2>/dev/null | grep -E '^[[:space:]]*(listen |server_name |root |location |try_files |proxy_pass |include /etc/nginx/sites-enabled/)' | head -n 90 || true
          echo "Read-only routing diagnosis complete."
      - name: Identify conflicting HTTPS frontend vhosts (read only)
        shell: bash
        run: |
          set -uo pipefail
          for site in /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/metadrive-frontend /etc/nginx/sites-enabled/metadrive-api; do
            echo "== selected directives from $site =="
            sudo -n grep -nE '^[[:space:]]*(server[[:space:]]*\\{|listen[[:space:]]|server_name[[:space:]]|root[[:space:]]|location[[:space:]]|return[[:space:]]|try_files[[:space:]]|proxy_pass[[:space:]]|ssl_certificate[[:space:]])' "$site" | head -n 110 || true
          done

      - name: Inspect recovery guards and transient MCP broker pressure (read only)
        shell: bash
        run: |
          set -uo pipefail
          echo "== single-boot manager recovery guards (presence only) =="
          for marker in metadrive-systemd-manager-reexec-once metadrive-systemd-manager-bus-reconnect-once metadrive-systemd-manager-mcp-gc-once; do
            if test -e "/run/lock/$marker"; then echo "$marker: used"; else echo "$marker: available"; fi
          done
          echo "== transient broker files (bounded count) =="
          sudo -n find /run/systemd/transient -maxdepth 1 -name 'metadrive-mcp-broker@*.service' -type f -printf '.' 2>/dev/null |
            wc -c || true
          echo "== broker active/failed state (bounded) =="
          timeout 10 systemctl list-units --all --no-pager --no-legend 'metadrive-mcp-broker@*.service' 2>&1 | head -n 35 || true
          echo "== manager jobs and unit pressure =="
          timeout 10 systemctl show -p Jobs -p NFailedUnits -p Reloading -p SystemState --no-pager 2>&1 || true
          echo "== stuck reload and broker processes =="
          ps -eo pid,ppid,stat,etime,wchan:30,comm | grep -E '(^ *PID|systemctl|dbus|systemd|metadrive-mcp)' | head -n 70 || true
          echo "Read-only manager recovery diagnosis complete."
