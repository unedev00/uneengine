name: Oracle API and frontend deployment

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "apps/connectors/**"
      - "scripts/oracle/**"
      - ".github/workflows/oracle-api-deploy.yml"
      - "package*.json"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/web/test/**"
      - "package*.json"
      - "tests/unit/suite.json"
      - ".github/workflows/oracle-api-deploy.yml"
      - "scripts/oracle/**"
      - "tests/integration/suite.json"

permissions:
  contents: read
  statuses: write

# PR validation runs on hosted runners and must not replace a queued main-branch
# production deployment. Keep all production deployments serialized separately.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('oracle-ci-{0}', github.head_ref) || 'oracle-production-full-stack' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify existing Oracle deployment helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/oracle/deploy-api.sh
          bash -n scripts/oracle/deploy-frontend.sh
          bash -n scripts/oracle/ensure-frontend-api-proxy.sh
          bash -n scripts/oracle/backup-production-sql.sh
          bash -n scripts/oracle/deploy-full-stack.sh
          bash -n scripts/oracle/recover-systemd-bus.sh
          bash -n scripts/oracle/recover-systemd-manager.sh
          bash -n scripts/oracle/check-communication-backlog.sh

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: oracle-production
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recover Oracle systemd D-Bus control plane if unresponsive
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          sudo -n true
          sudo -n env GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash scripts/oracle/recover-systemd-bus.sh
      - name: Recover stalled systemd daemon-reload once per boot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          sudo -n true
          sudo -n env GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash scripts/oracle/recover-systemd-manager.sh
      - name: Build release on the target architecture
        run: |
          npm ci
          npm run build
      - name: Verify production runner and active services
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          sudo -n true
          systemctl is-active --quiet metadrive-api.service
          systemctl is-active --quiet metadrive-worker.service
          systemctl is-active --quiet nginx.service
          sudo -n test -e /etc/metadrive/production.env
          sudo -n test -d /opt/metadrive/releases
      # deploy-api.sh activates both entrypoint.js and job-worker-entrypoint.js.
      - name: Deploy existing API/worker and frontend with SQL backup and rollback
        shell: bash
        run: sudo -n bash scripts/oracle/deploy-full-stack.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"
      - name: Verify deployed frontend contains reference builder
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/dist/index.html
          grep -R -l --include='*.js' 'reference-builder-layout' apps/web/dist/assets >/dev/null
          echo "Release contains reference builder layout."
      - name: Check Communication delivery health
        continue-on-error: true
        shell: bash
        run: |
          sudo -n bash scripts/oracle/check-communication-backlog.sh
          # oracle-production/communication
          # repair-oauth-function-owner.py remains an explicit, separately audited recovery tool.
