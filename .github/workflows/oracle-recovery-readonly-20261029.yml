name: Oracle manager emergency diagnostics (read only)
on:
  push:
    branches: [ops/oracle-recovery-diagnostics-20261029]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'unedev00/uneengine' && github.ref == 'refs/heads/ops/oracle-recovery-diagnostics-20261029'
    environment: oracle-production
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only systemd and reboot readiness checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          echo '=== POST GRACEFUL REBOOT VERIFICATION ==='
          echo '=== boot and manager process ==='
          ps -p 1 -o comm=,stat=,etime=
          uptime
          echo '=== disk and memory (capacity only) ==='
          df -h / /run
          free -m
          echo '=== systemd manager and reload status (no changes) ==='
          timeout 8 systemctl show --property=Version --value || echo 'manager show unresponsive'
          timeout 8 systemctl show metadrive-api.service -p ActiveState -p SubState -p WorkingDirectory --no-pager || echo 'api status unresponsive'
          echo '=== system bus status ==='
          timeout 8 busctl --system --no-pager list >/dev/null && echo 'system bus works' || echo 'system bus unresponsive'
          echo '=== runner capabilities ==='
          sudo -n true && echo 'noninteractive sudo available'
          if command -v oci >/dev/null 2>&1; then echo 'OCI CLI installed'; else echo 'OCI CLI unavailable'; fi
          if [ -f "$HOME/.oci/config" ]; then echo 'OCI CLI user config present'; else echo 'OCI CLI user config unavailable'; fi
          echo '=== kernel process waiting indicators ==='
          ps -eo stat=,comm= | awk '$1 ~ /^D/ {count++} END {print "uninterruptible processes:",count+0}'
          echo '=== OCI metadata and instance principal (no identifiers output) ==='
          instance_id="$(curl --silent --show-error --fail --noproxy '*' --max-time 8 -H 'Authorization: Bearer Oracle' http://169.254.169.254/opc/v2/instance/id || true)"
          if [[ "$instance_id" == ocid1.instance.* ]]; then
            echo 'OCI instance metadata is available'
            if timeout 35 oci --auth instance_principal compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output > /tmp/metadrive-oci-state 2>/dev/null; then
              echo 'Instance principal can read OCI compute state'
              cat /tmp/metadrive-oci-state
            else
              echo 'Instance principal has no usable compute read permission or cannot authenticate'
            fi
            rm -f /tmp/metadrive-oci-state
          else
            echo 'OCI instance metadata unavailable; cannot use self-action'
          fi

          echo '=== applied SQL migration checksum vs active release ==='
          filename=20270122-global-shared-builder-ribbon.sql
          db=metadrive_sql_20261022_production
          actual="$(sudo -n runuser -u postgres -- psql -X -Atq -v ON_ERROR_STOP=1 -d "$db" -c "SELECT checksum FROM md_system_migrations WHERE version='$filename'")"
          if [[ ! "$actual" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'Production migration checksum missing or invalid'; exit 1
          fi
          echo "Applied SQL sha256: $actual"
          release="$(timeout 8 systemctl show metadrive-api.service -p WorkingDirectory --value)"
          path="$release/apps/server/dist-system/system-support/migrations/$filename"
          if [[ -f "$path" ]]; then
            active="$(sha256sum "$path" | cut -d ' ' -f 1)"
            echo "Active release SQL sha256: $active"
            if [[ "$actual" == "$active" ]]; then echo 'DB checksum matches active release file'; else echo 'DB checksum differs from active release file'; fi
          else
            echo 'Active release does not contain this SQL file'
          fi
          if [[ -f "apps/server/src/system-support/migrations/$filename" ]]; then
            checkout="$(sha256sum "apps/server/src/system-support/migrations/$filename" | cut -d ' ' -f 1)"
            echo "Checked-out SQL sha256: $checkout"
          fi

          echo '=== checkout and retained release SQL hashes ==='
          if [[ -f "apps/server/src/system-support/migrations/$filename" ]]; then
            sha256sum "apps/server/src/system-support/migrations/$filename" | cut -d ' ' -f 1 | sed 's/^/Checked-out SQL sha256: /'
          fi
          sudo -n bash -c '
            set -euo pipefail
            base=/opt/metadrive/releases
            for f in "$base"/gh-*/apps/server/dist-system/system-support/migrations/20270122-global-shared-builder-ribbon.sql; do
              [[ -f "$f" ]] || continue
              hash="$(sha256sum "$f" | cut -d " " -f 1)"
              printf "Retained release SQL sha256: %s\n" "$hash"
            done
          '
          echo 'Read-only Oracle audit complete.'
