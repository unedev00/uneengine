name: Final cleaned frontend responsive browser verification
on:
  push:
    branches: [cleanup/frontend-dead-code-assets-20261107]
    paths:
      - '.github/workflows/frontend-cleanup-browser.yml'
permissions:
  contents: write
jobs:
  responsive-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install isolated Chromium browser dependencies
        shell: bash
        run: |
          mkdir -p /tmp/une-cleanup-browser
          npm install --prefix /tmp/une-cleanup-browser --no-save --no-package-lock playwright@1.64.1
          ln -s /tmp/une-cleanup-browser/node_modules/playwright node_modules/playwright
          ln -s /tmp/une-cleanup-browser/node_modules/playwright-core node_modules/playwright-core
          /tmp/une-cleanup-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start source Vite server with generated component sandbox
        shell: bash
        run: |
          npm run dev --workspace apps/web > /tmp/une-cleanup-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/test/setup-ux-fixture.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/une-cleanup-vite.log
          exit 1
      - name: Exercise responsive controls and screenshot at native 100 percent zoom
        env:
          PHASE1_SCREENSHOT_DIR: artifacts/cleanup-browser
          ALL_APPS_UI_AUDIT_DIR: artifacts/cleanup-all-apps
          UI_84_AUTH_SCREENSHOT_DIR: artifacts/cleanup-auth
          UI_84_AUTH_SCREENSHOTS: '1'
        run: |
          node scripts/setup-ux-browser-smoke.mjs
          node scripts/all-apps-ui-100pct-audit.mjs
          node scripts/ui-84-auth-responsive-browser.mjs
      - name: Verify and remove one-time browser workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/frontend-cleanup-browser.yml
          git commit -m "Complete responsive frontend cleanup browser verification"
          git push origin HEAD:cleanup/frontend-dead-code-assets-20261107
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-cleanup-100pct-browser-screenshots
          path: |
            artifacts/cleanup-browser/
            artifacts/cleanup-all-apps/
            artifacts/cleanup-auth/
          if-no-files-found: ignore
