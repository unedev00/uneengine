name: Page Builder checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/acetill/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/page-builder-checks.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/acetill/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/page-builder-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-builder-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-builder:
    name: Page Builder / build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify architecture and project references
        run: npm run audit:architecture
      - name: Check Page Builder and UNE component contracts
        run: npm run test:components
      - name: Build production web application
        run: npm run build --workspace apps/web
