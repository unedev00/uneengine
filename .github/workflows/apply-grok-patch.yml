name: Apply Grok canvas patch
on:
  workflow_dispatch:
  push:
    branches: [feat/grok-ribbon-canvas-tools]
    paths:
      - 'apps/web/src/core/builders/PageBuilder/grok-canvas.patch'
      - '.github/workflows/apply-grok-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/grok-ribbon-canvas-tools
          fetch-depth: 0

      - name: Restore pageBuilderView from main and apply patch
        run: |
          set -euo pipefail
          FILE=apps/web/src/core/builders/PageBuilder/pageBuilderView.tsx
          PATCH=apps/web/src/core/builders/PageBuilder/grok-canvas.patch
          # If still PLACEHOLDER or missing Grok tab, restore from main and apply
          if ! grep -q "'Grok'" "$FILE" 2>/dev/null; then
            git show origin/main:"$FILE" > "$FILE"
            git apply --verbose "$PATCH"
          fi
          # Verify
          grep -q "'Grok'" "$FILE"
          grep -q "ribbonTab==='Grok'" "$FILE"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          FILE=apps/web/src/core/builders/PageBuilder/pageBuilderView.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(page-builder): apply Grok ribbon + PowerPoint-style nudge/group"
          git push origin HEAD:feat/grok-ribbon-canvas-tools
