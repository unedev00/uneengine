name: Oracle frontend delivery

# Frontend-only maintenance. A live API release compatibility check is mandatory:
# if backend, connector, or shared dependencies changed, use the full-stack workflow.
# Main-branch changes deploy exclusively through oracle-api-deploy.yml.
# Two push workflows in the same concurrency group can silently replace a
# pending full-stack deployment with a frontend compatibility no-op.
# Frontend-only delivery remains an explicit, verified maintenance operation.
on:
  workflow_dispatch:

permissions:
  contents: read

# Same lock as full-stack deployment: do not race two production releases.
concurrency:
  group: oracle-production-release-main
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    environment: oracle-production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify compatibility with running Oracle API release
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "unedev00/uneengine"
          test "$(uname -m)" = "aarch64"
          api_sha="$(curl -fsS --max-time 15 https://api.unesolutions.co.uk/api/health | node -e '
            let body="";
            process.stdin.on("data",chunk=>body+=chunk);
            process.stdin.on("end",()=>{
              const data=JSON.parse(body);
              const sha=data?.release?.commit;
              if(data?.status!=="ok"||typeof sha!=="string"||!/^[a-f0-9]{40}$/.test(sha))process.exit(1);
              process.stdout.write(sha);
            });')"
          git cat-file -e "$api_sha^{commit}" || git fetch --no-tags --depth=1 origin "$api_sha"
          if ! git diff --quiet "$api_sha" "$GITHUB_SHA" -- \
             apps/server apps/connectors apps/acetill package.json package-lock.json \
             scripts/oracle/deploy-api.sh scripts/oracle/deploy-full-stack.sh; then
            echo "::error::Frontend deployment blocked: the live API is behind backend/shared changes. Run the protected full-stack deployment; never report a skipped publish as successful."
            exit 1
          fi
          echo "Frontend-compatible with live API release $api_sha"
          current="$(curl -fsS --max-time 12 -H 'Cache-Control: no-cache' "https://unesolutions.co.uk/frontend-release.json?check=$GITHUB_SHA" || true)"
          if [[ "$current" == *"\"commit\":\"$GITHUB_SHA\""* ]]; then
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            echo "Frontend already serving $GITHUB_SHA; no duplicate deployment needed."
          else
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build production frontend
        if: steps.compatibility.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build --workspace apps/web
          test -s apps/web/dist/index.html
          test -s apps/web/dist/frontend-release.json
          grep -Fq "\"commit\":\"$GITHUB_SHA\"" apps/web/dist/frontend-release.json
          grep -R -l --include='*.js' 'reference-builder-layout' apps/web/dist/assets >/dev/null
      - name: Publish frontend without restarting API or worker
        if: steps.compatibility.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          sudo -n bash scripts/oracle/deploy-frontend.sh "$GITHUB_WORKSPACE/apps/web/dist" "$GITHUB_SHA"
      - name: Verify local and public frontend release identities
        if: steps.compatibility.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deployed="$(readlink -f /var/www/metadrive-frontend/current)"
          test "$deployed" = "/var/www/metadrive-frontend/releases/$GITHUB_SHA"
          test -s "$deployed/index.html"
          local_sha="$(curl --noproxy '*' -fsS --max-time 15 --resolve unesolutions.co.uk:443:127.0.0.1 -H 'Cache-Control: no-cache' https://unesolutions.co.uk/frontend-release.json)"
          [[ "$local_sha" == *"\"commit\":\"$GITHUB_SHA\""* ]]
          public_sha=""
          for attempt in 1 2 3 4 5 6; do
            public_sha="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://unesolutions.co.uk/frontend-release.json?release=$GITHUB_SHA" || true)"
            [[ "$public_sha" == *"\"commit\":\"$GITHUB_SHA\""* ]] && break
            sleep 3
          done
          [[ "$public_sha" == *"\"commit\":\"$GITHUB_SHA\""* ]] || {
            echo "::error::The public HTTPS frontend is not serving the built release."
            exit 1
          }
          echo "Verified production frontend release: $GITHUB_SHA"
