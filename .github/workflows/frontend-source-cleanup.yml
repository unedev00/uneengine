name: Frontend source cleanup implementation
on:
  push:
    branches: [cleanup/frontend-dead-code-assets-20261107]
    paths:
      - 'scripts/frontend-safe-cleanup.mjs'
      - '.github/workflows/frontend-source-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture production baseline
        run: |
          npm run build --workspace apps/web
          node scripts/frontend-safe-cleanup.mjs measure before | tee /tmp/frontend-before.json
      - name: Prune proven-unused source and generated assets
        run: node scripts/frontend-safe-cleanup.mjs cleanup
      - name: Validate source, component contracts and production build
        run: |
          npm run audit:architecture
          npm run test:components
          npm run test:metadata
          npm run test:login
          npm run build --workspace apps/web
          node scripts/verify-web-lazy-bundle.mjs apps/web/dist
          node scripts/verify-pages-artifacts.mjs
      - name: Capture after metrics
        run: node scripts/frontend-safe-cleanup.mjs measure after | tee /tmp/frontend-after.json
      - name: Retire one-time cleanup machinery and commit verified edits
        run: |
          rm .github/workflows/frontend-source-cleanup.yml scripts/frontend-safe-cleanup.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove orphan frontend source, unused imports, redundant CSS and generated sandbox"
            git push origin HEAD:cleanup/frontend-dead-code-assets-20261107
          fi
      - name: Publish baseline and final byte measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-source-cleanup-metrics
          path: |
            /tmp/frontend-before.json
            /tmp/frontend-after.json
            /tmp/frontend-cleanup-summary.json
          if-no-files-found: ignore
