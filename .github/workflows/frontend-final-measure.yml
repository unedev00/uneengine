name: Final frontend build measurements
on:
  push:
    branches: [cleanup/frontend-dead-code-assets-20261107]
    paths:
      - '.github/workflows/frontend-final-measure.yml'
permissions:
  contents: write
jobs:
  final-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build final frontend
        run: npm run build --workspace apps/web
      - name: Measure final source, CSS, JS payload, build and renderer assets
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs=require('node:fs'), cp=require('node:child_process');
          const scan=d=>fs.existsSync(d)?fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?scan(d+'/'+e.name):[d+'/'+e.name]):[];
          const sum=a=>a.reduce((n,p)=>n+fs.statSync(p).size,0);
          const source=scan('apps/web/src');
          const css=source.filter(p=>p.endsWith('.css'));
          const dist=scan('apps/web/dist');
          const renderer=dist.filter(p=>p.startsWith('apps/web/dist/component-library/components/')&&p.endsWith('.json'));
          const lazy=JSON.parse(cp.execFileSync('node',['scripts/verify-web-lazy-bundle.mjs','apps/web/dist'],{encoding:'utf8'}));
          const out={sourceBytes:sum(source),cssBytes:sum(css),sourceFileCount:source.length,cssFileCount:css.length,
            productionBuildBytes:sum(dist),initialJsPayloadBytes:lazy.eagerlyLoadedJsBytes,
            rendererAssetBytes:sum(renderer),rendererAssetFileCount:renderer.length};
          console.log('FINAL_FRONTEND_METRICS='+JSON.stringify(out));
          fs.writeFileSync('/tmp/final-frontend-metrics.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Remove one-time metrics workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/frontend-final-measure.yml
          git commit -m "Finish frontend measurement workflow"
          git push origin HEAD:cleanup/frontend-dead-code-assets-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-frontend-build-metrics
          path: /tmp/final-frontend-metrics.json
          if-no-files-found: ignore
