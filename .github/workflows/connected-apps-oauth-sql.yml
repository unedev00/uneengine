name: Connected Apps OAuth SQL and consent
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/system-support/connected-app-service.ts'
      - 'apps/server/src/system-support/mcp-tools.ts'
      - 'apps/server/src/system-support/mcp-routes.ts'
      - 'apps/server/src/system-support/migrations/**'
      - 'apps/server/src/system-files/schema.sql'
      - 'apps/server/scripts/security-governance-sql-smoke.mjs'
      - 'apps/web/src/core/settings/SettingsWorkspace/TenantConnectedApps*'
      - '.github/workflows/connected-apps-oauth-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metadrive_oauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metadrive_oauth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metadrive_oauth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:system --workspace apps/server
      - name: Verify per-app OAuth scope SQL, consent, RBAC and migration replay
        run: npm run test:governance:sql --workspace apps/server
