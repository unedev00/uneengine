name: Phase 1 shared UI browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/setup-ux-browser-smoke.mjs'
      - 'scripts/ui-84-auth-responsive-browser.mjs'
      - 'scripts/ui-84-setup-home-browser.mjs'
      - 'scripts/ui-84-app-manager-browser.mjs'
      - 'scripts/ui-84-data-loader-browser.mjs'
      - 'scripts/all-apps-ui-100pct-audit.mjs'
      - '.github/workflows/ui-foundation-browser.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-ui-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-ui-browser:
    name: Responsive admin UI / browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked platform dependencies
        run: npm ci
      # Install the test runner outside the workspace: npm install in the root
      # re-resolves optional Expo/mobile packages and can fail on an unrelated
      # unpublished @expo/inline-modules tarball even after npm ci passed.
      - name: Install isolated Playwright browser dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/metadrive-phase1-playwright
          npm install --prefix /tmp/metadrive-phase1-playwright --no-save --no-package-lock playwright@1.64.1
          ln -s /tmp/metadrive-phase1-playwright/node_modules/playwright node_modules/playwright
          ln -s /tmp/metadrive-phase1-playwright/node_modules/playwright-core node_modules/playwright-core
      - name: Install Chromium and OS dependencies
        run: /tmp/metadrive-phase1-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated Vite fixture server
        shell: bash
        run: |
          set -euo pipefail
          npm run dev --workspace apps/web > /tmp/metadrive-phase1-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/test/setup-ux-fixture.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/metadrive-phase1-vite.log
          exit 1
      - name: Verify UI layouts and actions in Chromium
        env:
          PHASE1_SCREENSHOT_DIR: artifacts/phase1-ui
        run: node scripts/setup-ux-browser-smoke.mjs
      - name: Check login and password recovery at 19 original audit viewport sizes
        env:
          UI_84_AUTH_SCREENSHOT_DIR: artifacts/ui-84-auth
          UI_84_AUTH_SCREENSHOTS: '1'
        run: node scripts/ui-84-auth-responsive-browser.mjs
      - name: Check Setup Home at 19 original audit viewport sizes
        if: always()
        env:
          UI_84_SETUP_SCREENSHOT_DIR: artifacts/ui-84-setup-home
          UI_84_SETUP_SCREENSHOTS: '1'
        run: node scripts/ui-84-setup-home-browser.mjs
      - name: Check App Manager responsive registry, clone, and discard at 19 viewports
        if: always()
        env:
          UI_84_APPS_SCREENSHOT_DIR: artifacts/ui-84-app-manager
          UI_84_APPS_SCREENSHOTS: '1'
        run: node scripts/ui-84-app-manager-browser.mjs
      - name: Check Data Loader mouse/keyboard tabs at 19 original audit viewport sizes
        if: always()
        env:
          UI_84_LOADER_SCREENSHOT_DIR: artifacts/ui-84-loader
          UI_84_LOADER_SCREENSHOTS: '1'
        run: node scripts/ui-84-data-loader-browser.mjs
      - name: Audit every available React fixture at native 100% browser zoom
        if: success()
        env:
          ALL_APPS_UI_AUDIT_DIR: artifacts/all-apps-ui
        run: node scripts/all-apps-ui-100pct-audit.mjs
      - name: Upload source-backed 100 percent zoom UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-apps-100pct-visual-audit
          path: artifacts/all-apps-ui/
          if-no-files-found: ignore
      - name: Upload Data Loader viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-84-data-loader-19-viewports
          path: artifacts/ui-84-loader/
          if-no-files-found: ignore
      - name: Upload App Manager viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-84-app-manager-19-viewports
          path: artifacts/ui-84-app-manager/
          if-no-files-found: ignore
      - name: Upload Setup Home viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-84-setup-home-19-viewports
          path: artifacts/ui-84-setup-home/
          if-no-files-found: ignore
      - name: Upload login/recovery viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-84-auth-19-viewports
          path: artifacts/ui-84-auth/
          if-no-files-found: ignore
      - name: Upload before-review responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-ui-browser-screenshots
          path: artifacts/phase1-ui/*.png
          if-no-files-found: ignore
