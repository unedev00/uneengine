name: Retire unused legacy Page Builder source
on:
  push:
    branches: [cleanup/frontend-dead-code-assets-20261107]
    paths:
      - 'scripts/frontend-retire-ribbon.mjs'
      - '.github/workflows/frontend-retire-ribbon.yml'
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove verified test-only Page Builder modules and repair stale tests
        run: |
          node scripts/frontend-retire-ribbon.mjs
          rm scripts/frontend-retire-ribbon.mjs
      - name: Typecheck, build and run component and binding regression tests
        run: |
          npm run audit:architecture
          npm run test:components
          npx tsx --tsconfig apps/web/tsconfig.json --test apps/web/test/fourLayoutRibbon.test.mjs apps/web/test/pageBuilderNonDesignRibbonRequirements.test.ts apps/web/test/uneBuilderRibbonV2.test.mjs
          npm run test:metadata
          npm run build --workspace apps/web
          node scripts/verify-web-lazy-bundle.mjs apps/web/dist
      - name: Commit successful retirement without one-time automation
        run: |
          rm -f .github/workflows/frontend-retire-ribbon.yml scripts/frontend-retire-ribbon.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Retire source-only ribbon implementations and obsolete CSS"
            git push origin HEAD:cleanup/frontend-dead-code-assets-20261107
          fi
      - name: Upload removed-source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retired-ribbon-cleanup-summary
          path: /tmp/retired-ribbon-summary.json
          if-no-files-found: ignore
